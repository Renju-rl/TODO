<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TaskManager{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f6f9;
        color: #333;
    }

    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #2c3e50;
        color: white;
        padding: 15px 30px;
    }

    .nav-brand {
        font-size: 22px;
        font-weight: bold;
    }

    .nav-links {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .nav-links a {
        color: white;
        text-decoration: none;
        padding: 8px 15px;
        border-radius: 5px;
    }

    .nav-links a:hover {
        background-color: #34495e;
    }

    .btn-logout {
        background-color: #e74c3c;
    }

    .btn-primary-sm {
        background-color: #3498db;
    }

    .container {
        max-width: 1100px;
        margin: 30px auto;
        padding: 20px;
    }
</style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">📝 TaskManager</div>
        <div class="nav-links">
            {% if user %}
                <span>Welcome, <strong>{{ user.username }}</strong></span>
                <a href="/logout" class="btn-logout">Logout</a>
            {% else %}
                <a href="/login">Login</a>
                <a href="/register" class="btn-primary-sm">Sign Up</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
